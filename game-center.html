<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELVA // GAME GRID</title>
<style>
:root{--acid:#b8ff00;--cyan:#00eaff;--pink:#ff2bd6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
#liveWallpaper{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:0;pointer-events:none;filter:saturate(1.2) contrast(1.08)}
#liveWallpaperOverlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,.35) 45%,rgba(0,0,0,.92)),radial-gradient(circle at 50% 25%,rgba(255,43,214,.09),transparent 38%)}
.header,.content{position:relative;z-index:2}
.header{width:100%;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.2)}
.header .kicker{font:900 9px/1 Arial;letter-spacing:5px;color:var(--acid);margin-bottom:9px}
.header h1{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:clamp(29px,6vw,48px);letter-spacing:7px;color:#000;-webkit-text-stroke:1.5px #fff;text-shadow:0 0 12px rgba(255,255,255,.6),0 0 25px rgba(0,234,255,.25)}
.header-line{width:170px;height:2px;margin-top:10px;background:linear-gradient(90deg,transparent,var(--cyan),var(--acid),transparent);box-shadow:0 0 14px rgba(0,234,255,.6)}
.content{width:100%;min-height:calc(100vh - 120px);display:flex;justify-content:center;padding:34px 18px 100px}
.games{width:min(780px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.game-card{position:relative;min-height:280px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(255,255,255,.3);border-top:3px solid var(--acid);background:linear-gradient(145deg,rgba(4,8,12,.88),rgba(8,16,22,.58));clip-path:polygon(0 0,calc(100% - 25px) 0,100% 25px,100% 100%,0 100%);cursor:pointer;transition:.25s ease;overflow:hidden;box-shadow:0 14px 35px rgba(0,0,0,.45)}
.game-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 45%,rgba(0,234,255,.06));pointer-events:none}
.game-card:hover{transform:translateY(-7px);border-color:var(--cyan);border-top-color:var(--pink);box-shadow:0 0 28px rgba(0,234,255,.15),inset 0 0 35px rgba(0,234,255,.04)}
.game-card:active{transform:scale(.985)}
.game-number{position:absolute;top:16px;left:18px;color:var(--pink);font:900 9px/1 Arial;letter-spacing:3px}
.game-code{position:absolute;top:15px;right:18px;color:rgba(255,255,255,.35);font:800 9px/1 Arial;letter-spacing:2px}
.game-card h2{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:clamp(29px,5vw,43px);letter-spacing:3px;color:#000;-webkit-text-stroke:1.2px #fff;text-shadow:0 0 10px rgba(255,255,255,.3)}
.game-card p{margin-top:10px;color:#aeb5bf;font-size:11px;line-height:1.6;letter-spacing:1px;text-transform:uppercase}
.play-button{width:max-content;margin-top:18px;padding:10px 20px;border:1px solid var(--acid);background:rgba(184,255,0,.04);color:var(--acid);font:900 12px/1 Impact,Haettenschweiler,"Arial Black",sans-serif;letter-spacing:3px;transition:.2s}
.game-card:hover .play-button{background:var(--acid);color:#000;box-shadow:0 0 18px rgba(184,255,0,.45)}
.arrow{position:absolute;right:20px;bottom:24px;color:var(--cyan);font:900 30px/1 Arial;transition:.25s}
.game-card:hover .arrow{transform:translateX(7px)}
.back-button{position:fixed;left:18px;bottom:18px;z-index:20;padding:11px 18px;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.8);color:#fff;font:900 10px/1 Arial;letter-spacing:2px;cursor:pointer;transition:.2s}
.back-button:hover{border-color:var(--cyan);color:var(--cyan)}
@media(max-width:680px){.header{min-height:100px}.header h1{font-size:25px;letter-spacing:4px}.header-line{width:105px}.content{min-height:calc(100vh - 100px);padding:22px 14px 85px}.games{grid-template-columns:1fr;gap:14px}.game-card{min-height:205px;padding:23px}.game-card h2{font-size:29px}.game-card p{font-size:10px}.play-button{padding:9px 16px}.arrow{right:16px;bottom:19px}}
</style>
</head>
<body>
<video id="liveWallpaper" autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="assets/live_wallpaper_gamecenter.mp4" type="video/mp4"></video>
<div id="liveWallpaperOverlay" aria-hidden="true"></div>
<header class="header"><div class="kicker">// SELECT YOUR WEAPON</div><h1>SELVA // GAME GRID</h1><div class="header-line"></div></header>
<main class="content"><div class="games">
<div class="game-card" onclick="openGame('doodle-jump.html')"><span class="game-number">GAME 01 // ARCADE</span><span class="game-code">DJ-01</span><h2>DOODLE JUMP</h2><p>VERTICAL MAYHEM // JUMP. SURVIVE. DOMINATE.</p><div class="play-button">LAUNCH GAME</div><span class="arrow">↗</span></div>
<div class="game-card" onclick="openGame('dino-runner.html')"><span class="game-number">GAME 02 // RUNNER</span><span class="game-code">DR-02</span><h2>DINO RUNNER</h2><p>ENDLESS RUN // REACT. JUMP. SURVIVE.</p><div class="play-button">LAUNCH GAME</div><span class="arrow">↗</span></div>
</div></main>
<button class="back-button" onclick="goBack()">← BACK TO HQ</button>
<script>
function openGame(game){window.location.href=game;}
function goBack(){window.location.href='home.html';}
const v=document.getElementById('liveWallpaper');if(v)v.play().catch(()=>{});
</script>
</body>
</html>
