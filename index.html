<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELVA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
#logoVideo{width:100%;height:100%;object-fit:contain;background:#000}
</style>
</head>
<body>
<video id="logoVideo" autoplay muted playsinline preload="auto" poster="assets/selva_logo.png">
<source src="assets/selva_logo.mp4" type="video/mp4">
</video>
<script>
const video=document.getElementById('logoVideo');
let moved=false;
function next(){if(moved)return;moved=true;window.location.replace('welcome.html');}
video.addEventListener('ended',next);
video.addEventListener('error',next);
video.addEventListener('loadeddata',()=>{const p=video.play();if(p)p.catch(()=>{});});
setTimeout(next,30000);
</script>
</body>
</html>
