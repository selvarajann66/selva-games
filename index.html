<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Anime Music - Game Center</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= SPLASH ================= -->
<section id="splashScreen" class="screen splash-screen">
    <div class="splash-content">
        <img src="assets/selva_logo.png"
             class="selva-logo"
             alt="Selva">

        <h1>ANIME MUSIC</h1>
    </div>
</section>


<!-- ================= GAME CENTER ================= -->
<section id="gameCenter" class="screen game-center hidden">

    <div class="background-overlay"></div>

    <div class="game-center-content">

        <header class="game-center-header">

            <button id="backButton"
                    class="back-button"
                    type="button">
                ‹
            </button>

            <h1>GAME CENTER</h1>

        </header>


        <main class="game-list">

            <!-- DOODLE JUMP ONLY -->
            <article class="game-card">

                <div class="game-card-icon">
                    🎮
                </div>

                <div class="game-card-info">

                    <h2>DOODLE JUMP</h2>

                    <p>
                        Vertical Platform Jumper
                    </p>

                    <span id="bestScore">
                        BEST: 00000
                    </span>

                </div>

                <button id="playDoodle"
                        class="play-button"
                        type="button">
                    PLAY
                </button>

            </article>

        </main>

    </div>

</section>


<!-- ================= GAME ================= -->
<section id="gameScreen" class="screen game-screen hidden">

    <canvas id="gameCanvas"></canvas>


    <!-- DEVELOPER PASSWORD -->
    <div id="developerDialog"
         class="modal hidden">

        <div class="dialog">

            <h2>Developer Mode</h2>

            <p>Enter developer password</p>

            <input id="developerPassword"
                   type="password"
                   placeholder="Password"
                   autocomplete="off">

            <div class="dialog-buttons">

                <button id="developerCancel">
                    CANCEL
                </button>

                <button id="developerLogin">
                    ENTER
                </button>

            </div>

        </div>

    </div>


    <!-- DEVELOPER MENU -->
    <div id="developerMenu"
         class="modal hidden">

        <div class="dialog">

            <h2>Developer Mode</h2>

            <button id="jetpackButton"
                    class="wide-button">
                JETPACK MODE: OFF
            </button>

            <button id="developerClose"
                    class="wide-button secondary">
                CLOSE
            </button>

        </div>

    </div>

</section>


<script src="game.js"></script>

</body>
</html>
