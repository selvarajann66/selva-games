<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELVA // DIGITAL HQ</title>
<style>
:root{--acid:#b8ff00;--cyan:#00eaff;--pink:#ff2bd6;--white:#f5f7ff;--muted:#9ba3ad}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--white);font-family:Arial,Helvetica,sans-serif}
#liveWallpaper{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000;pointer-events:none;filter:saturate(1.15) contrast(1.08)}
#liveWallpaperOverlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,.34) 42%,rgba(0,0,0,.9)),radial-gradient(circle at 50% 35%,rgba(0,234,255,.10),transparent 42%)}
#selvaWebPage{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column}
.web-header{height:108px;display:flex;align-items:center;justify-content:center;flex-direction:column;border-bottom:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);flex-shrink:0}
.kicker{font:800 10px/1 Arial;letter-spacing:5px;color:var(--acid);margin-bottom:8px}
.web-header h1{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:clamp(28px,5vw,44px);letter-spacing:7px;color:#000;-webkit-text-stroke:1.5px var(--white);text-shadow:0 0 12px rgba(255,255,255,.55),0 0 28px rgba(0,234,255,.28)}
.header-line{width:170px;height:2px;margin-top:9px;background:linear-gradient(90deg,transparent,var(--cyan),var(--acid),transparent);box-shadow:0 0 14px rgba(0,234,255,.75)}
.web-content{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 18px;overflow:auto}
.menu-container{width:min(720px,100%);display:grid;gap:18px}
.menu-section{position:relative;min-height:150px;padding:28px 64px 25px 28px;border:1px solid rgba(255,255,255,.3);border-left:4px solid var(--acid);background:linear-gradient(110deg,rgba(0,0,0,.86),rgba(9,17,25,.58));clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));cursor:pointer;transition:.25s ease;box-shadow:inset 0 0 30px rgba(184,255,0,.025),0 12px 35px rgba(0,0,0,.35)}
.menu-section:before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,var(--acid),transparent 55%);opacity:.8}
.menu-section:hover{transform:translateX(7px);border-color:var(--cyan);border-left-color:var(--cyan);box-shadow:0 0 24px rgba(0,234,255,.16),inset 0 0 28px rgba(0,234,255,.04)}
.menu-section:active{transform:scale(.985)}
.menu-index{font:900 10px/1 Arial;letter-spacing:3px;color:var(--pink);margin-bottom:10px}
.menu-section h2{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:clamp(25px,5vw,38px);letter-spacing:3px;color:#000;-webkit-text-stroke:1px #fff;text-shadow:0 0 10px rgba(255,255,255,.3)}
.menu-section p{margin-top:9px;color:#aeb5bf;font-size:12px;line-height:1.55;letter-spacing:1.2px;text-transform:uppercase}
.menu-arrow{position:absolute;right:25px;top:50%;transform:translateY(-50%);font:900 34px/1 Arial;color:var(--acid);text-shadow:0 0 12px rgba(184,255,0,.55);transition:.25s}
.menu-section:hover .menu-arrow{transform:translate(6px,-50%);color:var(--cyan)}
.status{position:fixed;left:18px;bottom:16px;font:800 9px/1 Arial;letter-spacing:3px;color:rgba(255,255,255,.5);z-index:4}
.status b{color:var(--acid)}
@media(max-width:600px){.web-header{height:92px}.kicker{font-size:8px;letter-spacing:4px}.web-header h1{font-size:25px;letter-spacing:4px}.header-line{width:100px}.web-content{padding:20px 14px;align-items:center}.menu-container{gap:14px}.menu-section{min-height:135px;padding:24px 55px 22px 22px}.menu-section h2{font-size:24px}.menu-section p{font-size:10px}.menu-arrow{right:18px;font-size:28px}.status{bottom:10px;left:12px}}
</style>
</head>
<body>
<video id="liveWallpaper" autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="assets/live_wallpaper_home.mp4" type="video/mp4"></video>
<div id="liveWallpaperOverlay" aria-hidden="true"></div>
<section id="selvaWebPage">
<header class="web-header"><div class="kicker">// SYSTEM ONLINE</div><h1>SELVA // DIGITAL HQ</h1><div class="header-line"></div></header>
<main class="web-content"><div class="menu-container">
<div class="menu-section" id="gameCenterButton" onclick="goToGameCenter()"><div class="menu-index">01 // PLAY</div><h2>ENTER GAME CENTER</h2><p>TACTICAL PLAY // DOODLE JUMP + DINO RUNNER</p><span class="menu-arrow">↗</span></div>
<div class="menu-section" id="appsButton" onclick="goToApps()"><div class="menu-index">02 // BUILD</div><h2>ENTER APP CENTER</h2><p>SELVA BUILDS // APPS, TOOLS &amp; PROJECTS</p><span class="menu-arrow">↗</span></div>
</div></main></section>
<div class="status">// SELVA WEB <b>●</b> READY</div>
<script>
function goToGameCenter(){window.location.href='game-center.html';}
function goToApps(){window.location.href='app-center.html';}
const v=document.getElementById('liveWallpaper'); if(v){v.play().catch(()=>{});}
</script>
</body>
</html>
